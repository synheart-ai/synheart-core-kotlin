pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        mavenLocal() // fallback for locally-published sibling SDKs when composite-build dirs are absent
    }
}

rootProject.name = "synheart-core-android"
include ':synheart-core'

// The example app is included so CI COMPILES it. As loose, unreferenced source
// files it drifted out of sync with the SDK silently. It is not published —
// `maven-publish` is applied only in :synheart-core.
include ':example'

// Wear OS companion for :example. Shares its applicationId because the Wearable
// Data Layer only delivers between apps with the same package and signature.
include ':example-watch'

// Sibling SDK composite builds — only wire them in when the sibling checkout
// exists next to this repo (local multi-repo workspace). In CI / fresh clones
// the sibling dirs aren't present, so the corresponding Maven Central artifacts
// are used instead.
// Emotion and focus are NOT in this list — they are computed inside the
// synheart-engine runtime and accessed via CoreRuntimeBridge, not as
// independent Kotlin SDKs.
def siblings = [
        'synheart-wear-kotlin'    : [module: 'ai.synheart:synheart-wear', project: ':'],
        'synheart-behavior-kotlin': [module: 'ai.synheart:synheart-behavior', project: ':'],
        'synheart-session-kotlin' : [module: 'ai.synheart:synheart-session', project: ':'],
        'synheart-auth-kotlin'    : [module: 'ai.synheart:synheart-auth', project: ':lib'],
        'syni-kotlin'             : [module: 'ai.synheart:syni', project: ':syni'],
]

// Build exactly as CI does:
//
//   ./gradlew assemble -Psynheart.useSiblingBuilds=false
//
// Run this before pushing anything that touches a sibling SDK's API. A local
// checkout silently replaces the published artifact, so code calling an
// unreleased API compiles here and fails in CI with unresolved references.
//
// `providers.gradleProperty`, not `findProperty`: settings scripts have no
// `project`. Reads both -P flags and gradle.properties.
def useSiblings = providers.gradleProperty('synheart.useSiblingBuilds')
        .getOrElse('true').toBoolean()
if (!useSiblings) {
    logger.lifecycle('[synheart] sibling composite builds DISABLED — resolving published artifacts')
}

siblings.each { dir, info ->
    def siblingDir = file("../${dir}")
    if (useSiblings && siblingDir.exists() && (new File(siblingDir, 'settings.gradle').exists() || new File(siblingDir, 'settings.gradle.kts').exists())) {
        includeBuild("../${dir}") {
            dependencySubstitution {
                substitute module(info.module) using project(info.project)
            }
        }
    }
}
